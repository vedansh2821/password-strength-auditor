<svg xmlns="http://www.w3.org/2000/svg" width="687" height="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
<rect width="100%" height="100%" rx="8" fill="#0d1117"/>
<circle cx="20" cy="18" r="5" fill="#ff5f57"/><circle cx="38" cy="18" r="5" fill="#febc2e"/><circle cx="56" cy="18" r="5" fill="#28c840"/>
<text x="76" y="22" fill="#8b949e" font-size="12">terminal — help</text>
<text x="16" y="53" fill="#c9d1d9">usage: audit.py [-h] (--passwords-file PASSWORDS_FILE | --password PASSWORD)</text>
<text x="16" y="72" fill="#c9d1d9">                [--label LABEL] [--common-passwords COMMON_PASSWORDS]</text>
<text x="16" y="91" fill="#c9d1d9"></text>
<text x="16" y="110" fill="#c9d1d9">Local-only password strength auditor. No network, no logins.</text>
<text x="16" y="129" fill="#c9d1d9"></text>
<text x="16" y="148" fill="#c9d1d9">options:</text>
<text x="16" y="167" fill="#c9d1d9">  -h, --help            show this help message and exit</text>
<text x="16" y="186" fill="#c9d1d9">  --passwords-file PASSWORDS_FILE</text>
<text x="16" y="205" fill="#c9d1d9">                        File of passwords you own, one per line.</text>
<text x="16" y="224" fill="#c9d1d9">  --password PASSWORD   A single password to check (demo / quick check).</text>
<text x="16" y="243" fill="#c9d1d9">  --label LABEL         Label for a --password check.</text>
<text x="16" y="262" fill="#c9d1d9">  --common-passwords COMMON_PASSWORDS</text>
<text x="16" y="281" fill="#c9d1d9">                        Optional local common-passwords list (default: bundled</text>
<text x="16" y="300" fill="#c9d1d9">                        sample).</text>
</svg>
